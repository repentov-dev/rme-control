<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compressor</title>
<style>
  :root {
    color-scheme: dark;
    --muted: #6f6f7a;
    --txt: #f4f4f8;
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #root { height: 100%; }

  .app {
    position: relative;
    height: 100%;
    border-radius: 12px;
    padding: 10px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #000000;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 28px;
    flex: 0 0 auto;
  }

  .switch {
    position: relative;
    width: 30px;
    height: 16px;
    flex: 0 0 auto;
    padding: 0;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.10);
    transition: background .15s, border-color .15s;
  }

  .switch .knob {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #8a8a95;
    transition: transform .15s, background .15s;
  }

  .switch.on {
    background: #30d158;
    border-color: #30d158;
  }

  .switch.on .knob {
    transform: translateX(14px);
    background: #06140b;
  }

  .drag {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--txt);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .close {
    height: 18px;
    padding: 0 7px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.10em;
    color: #7c7c87;
    background: rgba(255, 255, 255, 0.07);
    transition: color .15s, background .15s;
  }

  .close:hover { color: #fff; background: #ff453a; }

  .body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: 10px;
  }

  .main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 12px;
  }

  .curve {
    position: relative;
    height: 140px;
    flex: 0 0 auto;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: #000000;
    overflow: hidden;
  }

  .curve svg { display: block; width: 100%; height: 100%; }

  .knobs {
    display: flex;
    justify-content: space-between;
    gap: 1px;
    flex: 0 0 auto;
  }

  .knob {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 0 0 19.5%;
    width: 19.5%;
    min-width: 0;
  }

  .svgwrap {
    width: 48px;
    height: 48px;
    touch-action: none;
    cursor: ns-resize;
  }

  .svgwrap svg { display: block; }

  .kval {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .klab {
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.10em;
    color: var(--muted);
  }

  .rail {
    flex: 0 0 70px;
    width: 70px;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: stretch;
  }

  .vmeter {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 2px 0 14px;
  }

  .vmeter .bar {
    position: relative;
    flex: 1 1 auto;
    width: 14px;
    min-height: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }

  .vmeter .fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 999px;
    transition: height .06s linear;
  }

  .vmeter .bar.top .fill {
    top: 0;
    bottom: auto;
  }

  .vmeter .vlab {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .vmeter .vval {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: 7px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .preset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .preset-label {
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.10em;
    color: var(--muted);
  }

  .dropdown {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }

  .dd-btn {
    width: 100%;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 0 8px 0 9px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #000000;
    color: #cfcfd8;
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    text-align: left;
  }

  .dd-btn:hover { border-color: rgba(255, 255, 255, 0.18); }

  .dd-current {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dd-caret {
    flex: 0 0 auto;
    color: var(--muted);
    transition: transform .15s;
  }

  .dd-btn.open .dd-caret { transform: rotate(180deg); }

  .dd-menu {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 5px);
    z-index: 30;
    max-height: 158px;
    overflow-y: auto;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #000000;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
  }

  .dd-group {
    margin: 6px -4px 0;
    padding: 4px 4px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
  }

  .dd-group-name {
    position: sticky;
    top: -4px;
    z-index: 2;
    margin: 0 -4px 3px;
    padding: 5px 8px 4px;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: #000000;
  }

  .dd-item {
    display: flex;
    align-items: center;
    width: 100%;
    height: 18px;
    padding: 0 8px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #b9b9c4;
    font-family: inherit;
    font-size: 10px;
    font-weight: 500;
    text-align: left;
  }

  .dd-item:hover { background: rgba(255, 255, 255, 0.09); color: #ffffff; }

  .dd-item.active { color: #cfe6ff; background: rgba(100, 210, 255, 0.12); }
</style>
</head>
<body>
<div id="root"></div>
<script src="window-drag.js"></script>
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="compressor.js"></script>
<script src="remote-bridge.js"></script>
</body>
</html>
