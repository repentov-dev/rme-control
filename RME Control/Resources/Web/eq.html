<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equalizer</title>
<style>
  :root {
    color-scheme: dark;
    --muted: #6f6f7a;
    --txt: #f4f4f8;
    --low: #ff9f0a;
    --mid: #64d2ff;
    --high: #30d158;
    --cut: #bf5af2;
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #root { height: 100%; }

  .app {
    position: relative;
    height: 100%;
    border-radius: 12px;
    padding: 10px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #000000;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 28px;
    flex: 0 0 auto;
  }

  .switch {
    position: relative;
    width: 30px;
    height: 16px;
    flex: 0 0 auto;
    padding: 0;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.10);
    transition: background .15s, border-color .15s;
  }

  .switch .knob {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #8a8a95;
    transition: transform .15s, background .15s;
  }

  .switch.on {
    background: #30d158;
    border-color: #30d158;
  }

  .switch.on .knob {
    transform: translateX(14px);
    background: #06140b;
  }

  .drag {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--txt);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .close {
    height: 18px;
    padding: 0 7px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.10em;
    color: #7c7c87;
    background: rgba(255, 255, 255, 0.07);
    transition: color .15s, background .15s;
  }

  .close:hover { color: #fff; background: #ff453a; }

  .graph {
    position: relative;
    flex: 1 1 auto;
    min-height: 130px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: #000000;
    overflow: hidden;
    touch-action: none;
  }

  .graph svg { display: block; width: 100%; height: 100%; }

  .band-tip {
    position: absolute;
    padding: 4px;
    border-radius: 9px;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(-3px);
    transition: opacity 0.13s ease, transform 0.13s ease;
    pointer-events: none;
    z-index: 10;
  }

  .band-tip.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .tip-grid {
    display: flex;
    gap: 4px;
  }

  .tip-chip {
    width: 20px;
    height: 20px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 0;
    background: transparent;
    color: #a8a8b4;
    font-family: inherit;
    font-size: 8px;
    font-weight: 700;
    transition: background 0.12s, opacity 0.12s;
  }



</style>
</head>
<body>
<div id="root"></div>
<script src="window-drag.js"></script>
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="eq.js"></script>
<script src="remote-bridge.js"></script>
</body>
</html>
